<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geodinâmica – Visualizador 3D (streaming)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1e2422; color: #fff; font-family: 'DM Sans', sans-serif; height: 100vh; overflow: hidden; }

  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.5rem;
    background: linear-gradient(to bottom, rgba(13,26,21,0.95) 0%, transparent 100%);
  }
  .topbar-brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; }
  .brand-text { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 0.95rem; letter-spacing: 0.04em; color: #fff; }
  .brand-text span { color: #67C187; }
  .topbar-info { position: absolute; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; }
  .model-name { font-family: 'Syne', sans-serif; font-size: 0.9rem; font-weight: 600; color: #fff; margin-bottom: 0.1rem; }
  .model-meta { font-size: 0.72rem; font-weight: 300; color: rgba(255,255,255,0.4); letter-spacing: 0.06em; text-transform: uppercase; }

  #axis-gizmo {
    position: absolute; bottom: 4.5rem; left: 1.5rem; z-index: 5;
    width: 86px; height: 86px; border-radius: 50%;
    cursor: grab; touch-action: none;
  }
  #axis-gizmo:active { cursor: grabbing; }
  .back-btn {
    display: flex; align-items: center; gap: 0.5rem;
    font-size: 0.78rem; font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase;
    color: rgba(255,255,255,0.45); text-decoration: none;
    border: 1px solid rgba(255,255,255,0.1); padding: 0.45rem 1rem; border-radius: 2px; transition: all 0.2s;
  }
  .back-btn:hover { color: #fff; border-color: rgba(255,255,255,0.25); }
  .back-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }

  #viewer-canvas { width: 100%; height: 100vh; display: block; }

  #loading {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #1e2422; z-index: 20; gap: 1.5rem; transition: opacity 0.6s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .loading-icon svg { width: 48px; height: 48px; animation: spin 2s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .loading-text { font-family: 'Syne', sans-serif; font-size: 0.85rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.5); }
  .loading-sub { font-size: 0.72rem; font-weight: 300; color: rgba(255,255,255,0.25); letter-spacing: 0.06em; }
  .loading-bar-wrap { width: 160px; height: 2px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
  .loading-bar { height: 100%; background: #005849; width: 0%; transition: width 0.3s ease; border-radius: 2px; }

  .controls-hint {
    position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
    display: flex; gap: 1.5rem;
    background: rgba(13,26,21,0.7); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 3px; padding: 0.6rem 1.25rem; backdrop-filter: blur(8px);
    opacity: 1; transition: opacity 1s ease; z-index: 5;
  }
  .controls-hint.fade { opacity: 0; }
  .hint-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.72rem; font-weight: 300; color: rgba(255,255,255,0.4); }
  .hint-key { font-size: 0.65rem; color: #67C187; border: 1px solid rgba(103,193,135,0.3); padding: 0.1rem 0.4rem; border-radius: 2px; }

  .geo-badge {
    position: absolute; bottom: 1.5rem; right: 1.5rem; z-index: 5;
    font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.08);
    padding: 0.25rem 0.6rem; border-radius: 2px;
  }
  .splat-badge {
    position: absolute; bottom: 1.5rem; left: 1.5rem; z-index: 5;
    font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: #67C187; border: 1px solid rgba(103,193,135,0.2);
    background: rgba(0,40,30,0.6); padding: 0.25rem 0.6rem; border-radius: 2px;
  }

  @media (max-width: 768px) {
    .topbar { padding: 0.6rem 1rem; }
    .topbar-info { display: none; }
    .brand-text { font-size: 0.78rem; letter-spacing: 0.02em; }
    .back-btn { font-size: 0.68rem; padding: 0.35rem 0.65rem; letter-spacing: 0.03em; }
    #axis-gizmo { width: 60px; height: 60px; bottom: 3.5rem; left: 1rem; }
    .geo-badge, .splat-badge { display: none; }
    .controls-hint { gap: 0.75rem; padding: 0.5rem 1rem; white-space: nowrap; }
    .hint-item { font-size: 0.65rem; }
  }

  #error-msg {
    display: none; position: absolute; inset: 0;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 1rem; background: #1e2422; z-index: 25;
    color: rgba(255,255,255,0.5); font-size: 0.9rem; font-weight: 300; text-align: center; padding: 1rem;
  }
  #error-msg.visible { display: flex; }
  #error-msg svg { width: 40px; height: 40px; stroke: rgba(255,255,255,0.2); fill: none; stroke-width: 1.5; stroke-linecap: round; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">

</head>
<body>

<div class="topbar">
  <a href="modelos.html" class="topbar-brand">
    <span class="brand-text">GEO<span>DINÂMICA</span></span>
  </a>
  <div class="topbar-info">
    <div class="model-name" id="model-title">Modelo 3D</div>
    <div class="model-meta">Visualização em streaming</div>
  </div>
  <a href="modelos.html" class="back-btn">
    <svg viewBox="0 0 16 16"><path d="M10 4l-4 4 4 4"/></svg>
    Portfólio
  </a>
</div>

<div id="loading">
  <div class="loading-icon">
    <svg viewBox="0 0 48 48" fill="none" stroke="#005849" stroke-width="2" stroke-linecap="round">
      <circle cx="24" cy="24" r="20" stroke="rgba(0,88,73,0.2)"/>
      <path d="M24 4 A20 20 0 0 1 44 24"/>
    </svg>
  </div>
  <div class="loading-text">Carregando modelo</div>
  <div class="loading-sub" id="loading-stage">Iniciando streaming...</div>
  <div class="loading-bar-wrap"><div class="loading-bar" id="loading-bar"></div></div>
</div>

<div id="error-msg">
  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  Não foi possível carregar o modelo.
  <span style="font-size:0.75rem;color:rgba(255,255,255,0.3)" id="error-detail"></span>
</div>

<canvas id="viewer-canvas"></canvas>

<div class="controls-hint" id="controls-hint">
  <div class="hint-item"><span class="hint-key">⟳</span> Arrastar para rotacionar</div>
  <div class="hint-item"><span class="hint-key">⊕</span> Scroll para zoom</div>
  <div class="hint-item"><span class="hint-key">⇥</span> Botão direito para mover</div>
</div>

<canvas id="axis-gizmo" width="86" height="86"></canvas>
<div class="splat-badge">Malha multiresolução · Nexus</div>
<div class="geo-badge">geodinamicasa.com.br</div>

<!-- Painel de diagnóstico (ativa com ?debug=1) -->
<pre id="dbg-panel" style="display:none;position:absolute;top:64px;right:12px;z-index:30;
  width:340px;max-height:80vh;overflow:auto;margin:0;padding:10px 12px;
  background:rgba(0,0,0,0.82);border:1px solid #67C187;border-radius:4px;
  font:11px/1.45 monospace;color:#9fe;white-space:pre-wrap;"></pre>

<script type="module">
// three é carregado como módulo ESM; o nexus3D.js é um bundle UMD que lê o THREE
// global e define window.Nexus3D — por isso expomos o THREE e carregamos a lib como
// script clássico antes de usá-la.
import * as THREE from 'https://esm.sh/three@0.160.0';
window.THREE = THREE;
await new Promise((resolve, reject) => {
  const s = document.createElement('script');
  s.src = './nexus3D.js';
  s.onload = resolve;
  s.onerror = () => reject(new Error('falha ao carregar nexus3D.js'));
  document.head.appendChild(s);
});
// O bundle UMD expõe um objeto { Nexus3D: classe }; pega o construtor de dentro
const _NX = window.Nexus3D;
const Nexus3D = (typeof _NX === 'function') ? _NX : _NX.Nexus3D;

const params    = new URLSearchParams(window.location.search);
const modelUrl  = params.get('modelo') || '';
const modelName = params.get('nome')   || 'Modelo 3D';
document.getElementById('model-title').textContent = modelName;

// ─── DIAGNÓSTICO (ativa com ?debug=1) ─────────────────────────────────────────
const DEBUG = params.has('debug');
const dbgState = { lib:'?', ctor:'?', onLoad:'não', sphere:'-', frames:0,
                   rbdCalls:0, nodesAvail:'-', nodesTotal:'-', errs:[] };
const dbgPanel = document.getElementById('dbg-panel');
function dbgRender() {
  if (!DEBUG) return;
  dbgPanel.style.display = 'block';
  dbgPanel.textContent =
    `NEXUS DEBUG\n` +
    `lib carregada:   ${dbgState.lib}\n` +
    `Nexus3D criado:  ${dbgState.ctor}\n` +
    `onLoad disparou: ${dbgState.onLoad}\n` +
    `boundingSphere:  ${dbgState.sphere}\n` +
    `frames render:   ${dbgState.frames}\n` +
    `renderBufferDir: ${dbgState.rbdCalls}  (>0 = traversal ativo)\n` +
    `nós carregados:  ${dbgState.nodesAvail} / ${dbgState.nodesTotal}\n` +
    `${dbgCam()}` +
    (dbgState.errs.length ? `\nERROS:\n` + dbgState.errs.slice(-6).join('\n') : `\n(sem erros capturados)`);
}
function dbgCam() {
  try {
    return `target câmera:   ${target.x.toFixed(1)}, ${target.y.toFixed(1)}, ${target.z.toFixed(1)}\n` +
           `raio câmera:     ${spherical.radius.toFixed(1)}\n`;
  } catch (_) { return ''; }
}
function dbgErr(where, e) {
  const msg = `[${where}] ${e && e.message ? e.message : e}`;
  dbgState.errs.push(msg);
  console.error(msg, e);
  dbgRender();
}
if (DEBUG) {
  dbgState.lib = (typeof Nexus3D === 'function') ? 'sim' : 'FALHOU';
  window.addEventListener('error', ev => dbgErr('window', ev.error || ev.message));
  window.addEventListener('unhandledrejection', ev => dbgErr('promise', ev.reason));
  dbgRender();
}

const stage = document.getElementById('loading-stage');
const bar   = document.getElementById('loading-bar');

if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
  document.getElementById('controls-hint').innerHTML = `
    <div class="hint-item"><span class="hint-key">1 dedo</span> Rotacionar</div>
    <div class="hint-item"><span class="hint-key">2 dedos</span> Zoom</div>`;
}
setTimeout(() => document.getElementById('controls-hint').classList.add('fade'), 5000);

function fail(detail) {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('error-msg').classList.add('visible');
  document.getElementById('error-detail').textContent = detail || '';
}
if (!modelUrl) { fail('URL do modelo (.nxz) não informada (parâmetro ?modelo=).'); throw new Error('sem URL'); }

// ─── RENDERER ───────────────────────────────────────────────────────────────
const canvas = document.getElementById('viewer-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e2422);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 5000);
camera.position.set(0, 2, 5);

// ─── CONTROLES (turntable Y-up, igual ao viewer GLB atual) ────────────────────
let isDragging = false, isPanning = false;
let prevMouse = { x: 0, y: 0 };
let spherical = { theta: 0.6, phi: 1.0, radius: 5 };
let target = new THREE.Vector3();
let panOffset = new THREE.Vector3();

function updateCamera() {
  const x = spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
  const y = spherical.radius * Math.cos(spherical.phi);
  const z = spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
  camera.position.set(target.x + x + panOffset.x, target.y + y + panOffset.y, target.z + z + panOffset.z);
  camera.lookAt(target.x + panOffset.x, target.y + panOffset.y, target.z + panOffset.z);
}

canvas.addEventListener('mousedown', e => {
  if (e.button === 2) isPanning = true; else isDragging = true;
  prevMouse = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('mousemove', e => {
  const dx = e.clientX - prevMouse.x, dy = e.clientY - prevMouse.y;
  if (isDragging) {
    spherical.theta -= dx * 0.005;
    spherical.phi = Math.max(0.01, Math.min(Math.PI - 0.01, spherical.phi - dy * 0.005));
  }
  if (isPanning) {
    const s = spherical.radius * 0.0012;
    const sinT = Math.sin(spherical.theta), cosT = Math.cos(spherical.theta);
    const sinP = Math.sin(spherical.phi),   cosP = Math.cos(spherical.phi);
    panOffset.x += (-cosT * dx - sinT * cosP * dy) * s;
    panOffset.y += (sinP * dy) * s;
    panOffset.z += (sinT * dx - cosT * cosP * dy) * s;
  }
  prevMouse = { x: e.clientX, y: e.clientY };
  updateCamera();
});
canvas.addEventListener('mouseup',    () => { isDragging = false; isPanning = false; });
canvas.addEventListener('mouseleave', () => { isDragging = false; isPanning = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
  spherical.radius = Math.max(0.05, Math.min(50000, spherical.radius * (1 + e.deltaY * 0.0008)));
  updateCamera();
}, { passive: true });

let lastTouchDist = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) { isDragging = true; prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }
  if (e.touches.length === 2) lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && isDragging) {
    const dx = e.touches[0].clientX - prevMouse.x, dy = e.touches[0].clientY - prevMouse.y;
    spherical.theta -= dx * 0.005;
    spherical.phi = Math.max(0.01, Math.min(Math.PI - 0.01, spherical.phi - dy * 0.005));
    prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    updateCamera();
  }
  if (e.touches.length === 2) {
    const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    spherical.radius = Math.max(0.05, Math.min(50000, spherical.radius * (1 - (dist - lastTouchDist) * 0.004)));
    lastTouchDist = dist; updateCamera();
  }
}, { passive: true });
canvas.addEventListener('touchend', () => { isDragging = false; });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
updateCamera();

// ─── NEXUS (malha multiresolução com streaming) ───────────────────────────────
// MeshBasicMaterial = unlit: mostra a textura fotogramétrica exatamente como exportada.
// IMPORTANTE: o material precisa de um `map` (mesmo placeholder) para a lib ativar o
// caminho de textura — ela substitui este map pelas texturas de cada patch do Nexus.
// Sem map, o modelo renderiza branco/sem textura.
const material = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide });
const _dummyTex = new THREE.DataTexture(new Uint8Array([255, 255, 255, 255]), 1, 1, THREE.RGBAFormat);
_dummyTex.colorSpace = THREE.SRGBColorSpace;
_dummyTex.needsUpdate = true;
material.map = _dummyTex;

let centered = false;
function centerModel(mesh) {
  if (centered) return;
  const sphere = mesh.boundingSphere;   // Nexus3D expõe aqui (geometry é só placeholder)
  if (!sphere || !sphere.radius) return;
  centered = true;
  target.copy(sphere.center);
  spherical.radius = sphere.radius * 2.2;
  camera.far  = Math.max(5000, sphere.radius * 50);
  camera.near = Math.max(0.01, sphere.radius * 0.001);
  camera.updateProjectionMatrix();
  updateCamera();
}

let nexus;
try {
  nexus = new Nexus3D(modelUrl, renderer, {
    material,
    onLoad: (mesh) => {
      const sph = mesh.boundingSphere;
      console.log('[nexus] onLoad — boundingSphere:', sph,
                  'center:', sph?.center, 'radius:', sph?.radius);
      dbgState.onLoad = 'sim';
      dbgState.sphere = sph
        ? `c(${sph.center.x.toFixed(1)},${sph.center.y.toFixed(1)},${sph.center.z.toFixed(1)}) r=${sph.radius?.toFixed(1)}`
        : 'NULL';
      // conta as chamadas de renderBufferDirect = prova de que o traversal roda
      if (typeof mesh.renderBufferDirect === 'function' && !mesh.__rbdWrapped) {
        const orig = mesh.renderBufferDirect.bind(mesh);
        mesh.renderBufferDirect = (...a) => { dbgState.rbdCalls++; return orig(...a); };
        mesh.__rbdWrapped = true;
      }
      scene.add(mesh);
      centerModel(mesh);
      if (DEBUG && sph && sph.radius) {
        // marcador de posição/extensão do modelo: se aparecer mas o modelo não,
        // o problema é streaming/material; se não aparecer nada, é câmera.
        const wire = new THREE.Mesh(
          new THREE.SphereGeometry(sph.radius, 24, 16),
          new THREE.MeshBasicMaterial({ color: 0x67C187, wireframe: true, transparent: true, opacity: 0.35 }));
        wire.position.copy(sph.center);
        scene.add(wire);
        const ax = new THREE.AxesHelper(sph.radius * 1.3);
        ax.position.copy(sph.center);
        scene.add(ax);
      }
      dbgRender();
      bar.style.width = '100%';
      stage.textContent = 'Pronto';
      setTimeout(() => document.getElementById('loading').classList.add('hidden'), 500);
    },
    onUpdate: (mesh) => {
      centerModel(mesh);
      if (mesh.mesh) { dbgState.nodesAvail = mesh.mesh.availableNodes; dbgState.nodesTotal = mesh.mesh.n_nodes; }
      dbgRender();
    },
    onProgress: (mesh, available, total) => {
      if (total > 0) {
        const pct = Math.min(99, Math.round(available / total * 100));
        bar.style.width = pct + '%';
        stage.textContent = 'Carregando detalhe...';
      }
      dbgState.nodesAvail = available; dbgState.nodesTotal = total;
      dbgRender();
    }
  });
  dbgState.ctor = 'sim';
  dbgRender();
} catch (e) {
  dbgState.ctor = 'FALHOU';
  dbgErr('ctor', e);
  console.error(e);
  fail(modelUrl);
}

// ─── LOOP DE RENDER ───────────────────────────────────────────────────────────
// Render contínuo: o Nexus atualiza o nível de detalhe a cada frame conforme a câmera
function animate() {
  requestAnimationFrame(animate);
  try {
    renderer.render(scene, camera);
    dbgState.frames++;
    if (DEBUG) {
      if (nexus && nexus.mesh) {
        dbgState.nodesAvail = nexus.mesh.availableNodes;
        dbgState.nodesTotal = nexus.mesh.n_nodes;
      }
      if (dbgState.frames % 30 === 0) dbgRender();
    }
  } catch (e) {
    if (!animate.__erred) { animate.__erred = true; dbgErr('render', e); }
  }
}
animate();

// ─── GIZMO DE EIXOS ────────────────────────────────────────────────────────────
(function initGizmo() {
  const g = document.getElementById('axis-gizmo');
  const ctx = g.getContext('2d');
  const W = g.width, H = g.height, cx = W/2, cy = H/2, LEN = 28;
  let ox = 0, oy = 0, dragging = false;
  g.addEventListener('pointerdown', e => {
    dragging = true; ox = e.clientX - g.offsetLeft; oy = e.clientY - g.offsetTop;
    g.setPointerCapture(e.pointerId); e.stopPropagation();
  });
  window.addEventListener('pointermove', e => {
    if (!dragging) return;
    g.style.left = (e.clientX - ox) + 'px'; g.style.top = (e.clientY - oy) + 'px';
    g.style.bottom = 'auto'; g.style.right = 'auto';
  });
  window.addEventListener('pointerup', () => { dragging = false; });
  function draw() {
    camera.updateMatrixWorld();
    const e = camera.matrixWorldInverse.elements;
    const axes = [
      { sx: e[0], sy: e[1], sz: e[2],  color: '#ff4444', label: 'X' },
      { sx: e[4], sy: e[5], sz: e[6],  color: '#44dd55', label: 'Y' },
      { sx: e[8], sy: e[9], sz: e[10], color: '#4488ff', label: 'Z' },
    ];
    axes.sort((a, b) => a.sz - b.sz);
    ctx.clearRect(0, 0, W, H);
    ctx.beginPath(); ctx.arc(cx, cy, cx - 1, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(13,26,21,0.65)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1; ctx.stroke();
    axes.forEach(ax => {
      const behind = ax.sz > 0;
      ctx.globalAlpha = behind ? 0.3 : 0.92;
      const ex = cx + ax.sx * LEN, ey = cy - ax.sy * LEN;
      ctx.strokeStyle = ax.color; ctx.lineWidth = behind ? 1.2 : 2;
      if (behind) ctx.setLineDash([3, 3]); else ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(ex, ey, behind ? 2 : 3, 0, Math.PI * 2);
      ctx.fillStyle = ax.color; ctx.fill();
      ctx.font = 'bold 9px sans-serif'; ctx.fillStyle = ax.color;
      ctx.fillText(ax.label, ex + (ax.sx >= 0 ? 4 : -11), ey + (ax.sy <= 0 ? -3 : 10));
      ctx.globalAlpha = 1;
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
